<!doctype html>
<html lang="{{ site.Language.Locale | default "en-us" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111715">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} &middot; {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  {{ with resources.Get "css/main.css" }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="{{ site.Home.RelPermalink }}"><span class="brand-mark">T</span><span>{{ site.Title }}<small>PERSONAL ENGINEERING PORTFOLIO</small></span></a><nav aria-label="Main navigation"><a href="{{ "#projects" | relURL }}">Projects <span aria-hidden="true">&rarr;</span></a></nav></div></header>
  <main class="container">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><div class="container footer-inner"><span>Engineering projects, experiments, and build logs</span><a href="https://github.com/traysonr/x">Source on GitHub &nearr;</a></div></footer>
</body>
</html>
