<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">433Link radio system concept</title><desc id="desc">The planned first milestone sends a protocol test packet from a dsPIC through a 433 MHz ASK/OOK link to a Raspberry Pi.</desc>
<rect width="1200" height="500" rx="18" fill="#111715"/><text x="60" y="60" fill="#edf3ee" font-family="Arial,sans-serif" font-size="21" letter-spacing="4">433LINK / PROTOCOL V1</text><text x="60" y="91" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="16">A small packet link, built from the bytes up</text>
<rect x="60" y="140" width="300" height="190" rx="12" fill="#172321" stroke="#41625a" stroke-width="2"/><text x="90" y="188" fill="#6edcc4" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">TRANSMITTER / PLANNED</text><text x="90" y="232" fill="#edf3ee" font-family="Arial,sans-serif" font-size="24">dsPIC33CK64MC105</text><text x="90" y="273" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="17">timer-driven DATA frame</text>
<rect x="840" y="140" width="300" height="190" rx="12" fill="#172321" stroke="#41625a" stroke-width="2"/><text x="870" y="188" fill="#6edcc4" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">RECEIVER / PLANNED</text><text x="870" y="232" fill="#edf3ee" font-family="Arial,sans-serif" font-size="24">Raspberry Pi 3</text><text x="870" y="273" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="17">frame decode + CRC check</text>
<path d="M380 239H820" stroke="#6edcc4" stroke-width="3" stroke-dasharray="8 10"/><path d="M408 239v-28h18v56h18v-56h18v28m120 0h18v-28h18v56h18v-56h18v28m120 0h18v-28h18v56h18v-56h18v28" fill="none" stroke="#eea45e" stroke-width="3"/><text x="494" y="187" fill="#edf3ee" font-family="Arial,sans-serif" font-size="19">FS1000A · 433.92 MHz</text><text x="493" y="301" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="16">ASK/OOK · Manchester · 2 kbit/s</text>
<rect x="60" y="374" width="1080" height="70" rx="10" fill="#172321"/><text x="88" y="417" fill="#6edcc4" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">M1</text><text x="135" y="417" fill="#edf3ee" font-family="Arial,sans-serif" font-size="18">PIC → Pi DATA</text><text x="497" y="417" fill="#8fa39b" font-family="Arial,sans-serif" font-size="16">Design diagram · physical link not yet verified</text><text x="951" y="417" fill="#eea45e" font-family="Arial,sans-serif" font-size="16">M2 ACK / RETRY</text>
</svg>
