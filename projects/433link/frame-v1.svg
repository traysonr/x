<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">433Link protocol version 1 frame</title><desc id="desc">An on-air frame consists of eight 0x55 preamble bytes, sync D3 91, a logical packet, and a low-byte-first CRC. A known packet is included below.</desc>
<rect width="1200" height="560" rx="18" fill="#111715"/><text x="54" y="58" fill="#edf3ee" font-family="Arial,sans-serif" font-size="21" letter-spacing="3">ONE SOURCE OF TRUTH / 433LINK FRAME V1</text><text x="54" y="91" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="16">Protocol design and software test vector · not a captured RF waveform</text>
<text x="55" y="148" fill="#6edcc4" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">ON AIR</text>
<rect x="54" y="164" width="205" height="60" rx="6" fill="#203a35"/><text x="72" y="190" fill="#edf3ee" font-family="Arial,sans-serif" font-size="16">PREAMBLE</text><text x="72" y="212" fill="#9edfd1" font-family="Arial,sans-serif" font-size="14">55 × 8 bytes</text>
<rect x="266" y="164" width="128" height="60" rx="6" fill="#33473e"/><text x="285" y="190" fill="#edf3ee" font-family="Arial,sans-serif" font-size="16">SYNC</text><text x="285" y="212" fill="#c3d2c6" font-family="Arial,sans-serif" font-size="14">D3 91</text>
<rect x="401" y="164" width="745" height="60" rx="6" fill="#202b31"/><text x="424" y="201" fill="#edf3ee" font-family="Arial,sans-serif" font-size="18">LOGICAL PACKET</text>
<text x="55" y="270" fill="#6edcc4" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">PACKET BYTES</text>
<g font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><rect x="54" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="119" y="311" fill="#edf3ee">VERSION</text><text x="119" y="334" fill="#9edfd1">1 byte</text><rect x="190" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="255" y="311" fill="#edf3ee">TYPE</text><text x="255" y="334" fill="#9edfd1">1 byte</text><rect x="326" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="391" y="311" fill="#edf3ee">SOURCE</text><text x="391" y="334" fill="#9edfd1">1 byte</text><rect x="462" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="527" y="311" fill="#edf3ee">DEST</text><text x="527" y="334" fill="#9edfd1">1 byte</text><rect x="598" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="663" y="311" fill="#edf3ee">SEQUENCE</text><text x="663" y="334" fill="#9edfd1">1 byte</text><rect x="734" y="286" width="130" height="62" rx="5" fill="#243b36"/><text x="799" y="311" fill="#edf3ee">LENGTH</text><text x="799" y="334" fill="#9edfd1">0–32</text><rect x="870" y="286" width="130" height="62" rx="5" fill="#34433a"/><text x="935" y="311" fill="#edf3ee">PAYLOAD</text><text x="935" y="334" fill="#d8c9a9">0–32 bytes</text><rect x="1006" y="286" width="140" height="62" rx="5" fill="#49372b"/><text x="1076" y="311" fill="#edf3ee">CRC-16</text><text x="1076" y="334" fill="#f0bd88">low byte first</text></g>
<text x="55" y="393" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="16">2,000 logical bits/s · Manchester 0 = 01, 1 = 10 · 250 µs per half-bit · bytes sent MSB-first</text>
<rect x="54" y="420" width="1092" height="92" rx="9" fill="#182521" stroke="#2e5147"/><text x="76" y="452" fill="#6edcc4" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">REFERENCE DATA PACKET</text><text x="76" y="486" fill="#edf3ee" font-family="Consolas,monospace" font-size="20">01 01 01 02 00 03 11 22 33 98 0E</text><text x="812" y="486" fill="#a8b6b0" font-family="Arial,sans-serif" font-size="15">CRC over header + payload</text>
</svg>
