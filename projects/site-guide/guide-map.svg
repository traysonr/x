<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Portfolio content and layout map</title><desc id="desc">A diagram shows Markdown content feeding shared Hugo templates, then CSS, which produces the home page and project log.</desc>
