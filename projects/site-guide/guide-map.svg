<rect x="470" y="300" width="250" height="130" rx="3" fill="#202a25" stroke="#39473e"/><text x="490" y="330" fill="#edf2ec" font-size="18" font-weight="600">Project log</text><text x="490" y="358" fill="#98a49d" font-size="14">Title, intro, hero image</text><text x="490" y="382" fill="#98a49d" font-size="14">and chronological entries</text><text x="490" y="406" fill="#98a49d" font-size="14">with responsive media</text></g>
