<text x="54" y="58" fill="#c8f169" font-family="Consolas,monospace" font-size="15" letter-spacing="2">CONTENT → HUGO → SITE</text>
<g font-family="Segoe UI,Arial,sans-serif">
<g><rect x="55" y="105" width="300" height="370" rx="4" fill="#171f1c" stroke="#435047"/><text x="80" y="145" fill="#c8f169" font-family="Consolas,monospace" font-size="14">01 / CONTENT BUNDLES</text>
