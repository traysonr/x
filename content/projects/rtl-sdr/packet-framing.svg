<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">CRC-valid frames in a 433.900 MHz capture</title>
<desc id="desc">The capture contained 84 frames in group A and 312 in group B, near 433.8885 and 433.9114 MHz respectively.</desc>
<rect width="1000" height="460" fill="#111715" rx="16"/><text x="56" y="58" fill="#edf3ee" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">ONE CAPTURE / TWO REPEATING FRAME TYPES</text><text x="56" y="91" fill="#aab7b0" font-family="Arial,sans-serif" font-size="15">60 s centered at 433.900 MHz · 1.024 MS/s · CRC-16 validated</text>
<text x="56" y="159" fill="#6edcc4" font-family="Arial,sans-serif" font-size="17">A · 433.8885 MHz</text><rect x="56" y="178" width="200" height="20" rx="4" fill="#263a37"/><rect x="56" y="178" width="54" height="20" rx="4" fill="#6edcc4"/><text x="278" y="195" fill="#edf3ee" font-family="Arial,sans-serif" font-size="17">84 frames</text><text x="790" y="195" fill="#aab7b0" font-family="Arial,sans-serif" font-size="16">~76 ms · payload 00</text>
<text x="56" y="257" fill="#eea45e" font-family="Arial,sans-serif" font-size="17">B · 433.9114 MHz</text><rect x="56" y="276" width="200" height="20" rx="4" fill="#3a3028"/><rect x="56" y="276" width="200" height="20" rx="4" fill="#eea45e"/><text x="278" y="293" fill="#edf3ee" font-family="Arial,sans-serif" font-size="17">312 frames</text><text x="790" y="293" fill="#aab7b0" font-family="Arial,sans-serif" font-size="16">~84 ms · payload 11 22 33</text>
<path d="M56 336H944" stroke="#304039"/><text x="56" y="377" fill="#aab7b0" font-family="Arial,sans-serif" font-size="16">396 valid frames</text><text x="250" y="377" fill="#aab7b0" font-family="Arial,sans-serif" font-size="16">67 sync candidates rejected by CRC</text><text x="56" y="420" fill="#7f928a" font-family="Arial,sans-serif" font-size="14">Frame family is established; transmitter identity and header meaning remain unknown.</text>
</svg>
